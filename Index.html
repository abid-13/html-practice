<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Forming</title>
</head>
<body>
  <h1>Input Tag Types Practice</h1>
  <form action="submit.php" method="post">
    <label for="dateofbirth">Date Of Birth:</label><br>
    <input type="date" id="dateofbirth" name="dateofbirth" required><br><br>
    
    <label for="chooseyourfile">Enter Your File:</label><br>
    <input type="file" id="chooseyourfile" name="myfiles[ ]" multiple required><br><br>
    
    <label for="favcolor">Choose Your Favourite Color:</label><br>
    <input type="color" id="favcolor" name="colouring" required><br><br>
    
    <label for="pricerange">Enter Your Price:</label><br>
    <input type="range" id="pricerange" name="buying" required min="0" max="1000"><br><br>
    
    <input type="submit" value="Enter">
  </form><hr>
  
  <h1>Submit Gender</h1>
  <form>
    <label for="male">Male:</label>
    <input type="radio" id="male" name="gender"checked><br>
    
    <label for="female">Female:</label>
    <input type="radio" id="female" name="gender"><br>
    
    <label for="others">Others:</label>
    <input type="radio" id="others" name="gender">
  </form><hr>
  
  <h1>Submit Languages</h1>
  <form>
    <label for="html">HTML</label>
    <input type="checkbox" id="html" name="languages[]" value="html" checked><br>
    
    <label for="css">CSS</label>
    <input type="checkbox" id="css" name="languages[]" value="css"><br>
    
    <label for="js">JavaScript</label>
    <input type="checkbox" id="js" name="languages[]" value="js"><br>
    
    <label for="python">Python</label>
    <input type="checkbox" id="python" name="languages[]" value="python">
  </form><hr>
  
  <h1>South Asian Countries</h1>
  <form>
    <label>Choose Your Country:</label>
    <select id="country" name="countries">
      <option value="pakistan">Pakistan</option>
      <option value="india">India</option>
      <option value="afghanistan">Afghanistan</option>
      <option value="srilanka">Srilanka</option>
      <option value="bangladesh">Bangladesh</option>
    </select>
  </form><hr>
</body>
</html>
